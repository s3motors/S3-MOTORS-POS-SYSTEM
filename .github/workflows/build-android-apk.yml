name: Build S3 Motors POS APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android WebView project
        run: |
          mkdir -p app/src/main/java/com/s3motors/pos
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "S3MotorsPOS"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.s3motors.pos'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.s3motors.pos'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="S3 Motors POS"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:statusBarColor">#0A0A0A</item>
                  <item name="android:navigationBarColor">#0A0A0A</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0A0A0A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#D4AF37" android:pathData="M54,8a46,46 0,1 0,0 92a46,46 0,1 0,0 -92"/>
              <path android:fillColor="#0A0A0A" android:pathData="M54,14a40,40 0,1 0,0 80a40,40 0,1 0,0 -80"/>
              <path android:fillColor="#F5D061" android:pathData="M72,34c-4,-5 -10,-8 -18,-8 -14,0 -23,8 -23,19 0,9 6,14 19,17l8,2c5,1 7,3 7,6 0,4 -4,7 -11,7 -7,0 -13,-3 -18,-8l-9,10c7,7 16,11 27,11 16,0 26,-8 26,-21 0,-10 -6,-15 -20,-18l-8,-2c-4,-1 -6,-2 -6,-5 0,-3 3,-5 8,-5 6,0 11,2 15,6z"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26-placeholder.txt <<'EOF'
          S3 Motors POS launcher icon is defined as a vector drawable.
          EOF
          cat > app/src/main/java/com/s3motors/pos/MainActivity.java <<'EOF'
          package com.s3motors.pos;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String POS_URL =
                  "https://s3motors.github.io/S3-MOTORS-POS-SYSTEM/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(10,10,10));
                  getWindow().setNavigationBarColor(Color.BLACK);
                  hideSystemBars();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(10,10,10));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });
                  setContentView(webView);
                  if (savedInstanceState == null) {
                      webView.loadUrl(POS_URL);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemBars();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S3-Motors-POS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
