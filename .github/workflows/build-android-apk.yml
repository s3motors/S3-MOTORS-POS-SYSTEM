name: Build S3 Motors POS APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "android-assets/s3-motors-logo.png"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android WebView project
        run: |
          mkdir -p app/src/main/java/com/s3motors/pos
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi
          cp android-assets/s3-motors-logo.png app/src/main/res/drawable-nodpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "S3MotorsPOS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.s3motors.pos'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.s3motors.pos'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="S3 Motors POS"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D4AF37</item>
                  <item name="android:statusBarColor">#0A0A0A</item>
                  <item name="android:navigationBarColor">#0A0A0A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/s3motors/pos/MainActivity.java <<'EOF'
          package com.s3motors.pos;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.ValueCallback;
          import android.net.Uri;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.graphics.Color;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;
              private static final String POS_URL =
                  "https://s3motors.github.io/S3-MOTORS-POS-SYSTEM/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(10,10,10));
                  getWindow().setNavigationBarColor(Color.BLACK);
                  hideSystemBars();

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(10,10,10));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  settings.setSupportMultipleWindows(false);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          String[] accepted = params.getAcceptTypes();
                          if (accepted != null && accepted.length == 1 && !accepted[0].isEmpty()) {
                              intent.setType(accepted[0]);
                          } else {
                              intent.setType("*/*");
                              if (accepted != null && accepted.length > 1) {
                                  intent.putExtra(Intent.EXTRA_MIME_TYPES, accepted);
                              }
                          }
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                              params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);
                          try {
                              startActivityForResult(
                                  Intent.createChooser(intent, "Choose S3 Motors logo"),
                                  FILE_CHOOSER_REQUEST_CODE);
                          } catch (ActivityNotFoundException e) {
                              filePathCallback = null;
                              callback.onReceiveValue(null);
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });
                  setContentView(webView);
                  if (savedInstanceState == null) webView.loadUrl(POS_URL);
                  else webView.restoreState(savedInstanceState);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              ClipData clipData = data.getClipData();
                              results = new Uri[clipData.getItemCount()];
                              for (int i = 0; i < clipData.getItemCount(); i++) {
                                  results[i] = clipData.getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[] { data.getData() };
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemBars();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(null);
                      filePathCallback = null;
                  }
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S3-Motors-POS-APK-v1.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
